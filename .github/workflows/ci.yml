name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Check the package
        run: npm run check:package

  integration:
    name: Test-mode integration
    runs-on: ubuntu-latest
    needs: test
    env:
      AGILIS_TEST_API_KEY: ${{ secrets.AGILIS_TEST_API_KEY }}
    steps:
      - name: Check for a Test key
        id: key
        run: |
          if [ -z "$AGILIS_TEST_API_KEY" ]; then
            echo "AGILIS_TEST_API_KEY is not set: skipping the Test-mode integration tests."
            echo "present=false" >> "$GITHUB_OUTPUT"
          elif [[ "$AGILIS_TEST_API_KEY" == pk_live_* ]]; then
            echo "::error::AGILIS_TEST_API_KEY is a Live key. The integration tests only run with a Test key."
            exit 1
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.key.outputs.present == 'true'
      - uses: actions/setup-node@v5
        if: steps.key.outputs.present == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.key.outputs.present == 'true'
      - name: Integration tests (Test mode)
        if: steps.key.outputs.present == 'true'
        run: npm run test:integration
